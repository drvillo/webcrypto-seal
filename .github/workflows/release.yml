name: Release

on:
  # Publish when a GitHub Release is published (tag it, write notes, publish).
  release:
    types: [published]
  # Manual escape hatch for re-runs.
  workflow_dispatch:

# id-token: write is what enables npm provenance + OIDC Trusted Publishing.
# No long-lived NPM_TOKEN is stored anywhere.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: build + publish (provenance)
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install (frozen lockfile, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Publish gates run explicitly here because .npmrc ignore-scripts disables
      # the prepublishOnly hook during `npm publish`.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build

      # Trusted Publishing requires npm >= 11.5.1 for OIDC exchange.
      # Pin to npm@11: npm@latest (12+) needs Node ^22.22 / ^24.15, but this
      # job stays on Node 20 to match package engines.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11

      # With a Trusted Publisher configured on npmjs.com for this repo+workflow,
      # no token is needed and provenance is attached automatically.
      - name: Publish to npm
        run: npm publish --provenance --access public
